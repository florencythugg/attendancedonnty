name: Build Pulse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Pulse Icon & Splash Screen
        run: |
          python3 -m pip install pillow
          mkdir -p resources
          python3 - << 'EOF'
          from PIL import Image, ImageDraw

          size = 1024
          img = Image.new("RGBA", (size, size), (3, 7, 18, 255))
          draw = ImageDraw.Draw(img)

          for y in range(size):
              r = int(14 + (59 - 14) * (y / size))
              g = int(165 + (130 - 165) * (y / size))
              b = int(233 + (246 - 233) * (y / size))
              draw.line([(0, y), (size, y)], fill=(r, g, b, 255))

          pts = [
              (180, 520),
              (330, 520),
              (410, 310),
              (510, 720),
              (610, 260),
              (690, 520),
              (844, 520)
          ]
          draw.line(pts, fill=(255, 255, 255, 255), width=64, joint="curve")

          img.save("resources/icon.png")

          splash = Image.new("RGBA", (2732, 2732), (3, 7, 18, 255))
          icon_resized = img.resize((520, 520), Image.Resampling.LANCZOS)
          mask = Image.new("L", (520, 520), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, 520, 520], radius=120, fill=255)
          splash.paste(icon_resized, ((2732 - 520) // 2, (2732 - 520) // 2), mask)
          splash.save("resources/splash.png")
          EOF

      - name: Install dependencies & build web app
        run: |
          npm install
          npm install -D @capacitor/assets @capacitor/core @capacitor/android
          npm run build

      - name: Add Android platform, icons, dark bars & permissions
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.pulse.attendance",
            "appName": "Pulse",
            "webDir": "dist",
            "backgroundColor": "#030712",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx capacitor-assets generate --android || true
          npx cap sync android

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: $MANIFEST not found after npx cap sync android"
            ls -la android/app/src/main || true
            exit 1
          fi

          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' "$MANIFEST"
          fi

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#030712</item>
                  <item name="colorPrimaryDark">#030712</item>
                  <item name="colorAccent">#22d3ee</item>
                  <item name="android:windowBackground">#030712</item>
                  <item name="android:statusBarColor">#030712</item>
                  <item name="android:navigationBarColor">#030712</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:enforceNavigationBarContrast">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme">
                  <item name="android:background">#030712</item>
              </style>
          </resources>
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ../Pulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-APK
          path: Pulse.apk
