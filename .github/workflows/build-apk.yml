name: Build Pulse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Carbon Monochrome Icon & Splash Screen
        run: |
          python3 -m pip install pillow
          mkdir -p resources
          python3 - << 'EOF'
          from PIL import Image, ImageDraw

          size = 1024
          img = Image.new("RGBA", (size, size), (10, 10, 12, 255))
          draw = ImageDraw.Draw(img)

          for y in range(size):
              v = int(24 - 14 * (y / size))
              draw.line([(0, y), (size, y)], fill=(v, v, v + 2, 255))

          draw.rounded_rectangle(
              [36, 36, size - 36, size - 36],
              radius=220,
              outline=(212, 212, 216, 255),
              width=22
          )

          pts = [
              (180, 520),
              (330, 520),
              (410, 310),
              (510, 720),
              (610, 260),
              (690, 520),
              (844, 520)
          ]
          draw.line(pts, fill=(255, 255, 255, 255), width=64, joint="curve")

          img.save("resources/icon.png")

          splash = Image.new("RGBA", (2732, 2732), (6, 6, 7, 255))
          icon_resized = img.resize((520, 520), Image.Resampling.LANCZOS)
          mask = Image.new("L", (520, 520), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, 520, 520], radius=120, fill=255)
          splash.paste(icon_resized, ((2732 - 520) // 2, (2732 - 520) // 2), mask)
          splash.save("resources/splash.png")
          EOF

      - name: Install dependencies & build web app
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          npm run build

      - name: Add Android platform, icons, dark bars & permissions
        run: |
          npx cap add android || true
          npx capacitor-assets generate --android || true
          npx cap sync android

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            python3 - << 'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              txt = f.read()
          perms = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
          ]
          missing = [f'    <uses-permission android:name="{p}" />' for p in perms if p not in txt]
          if missing:
              target = '<uses-permission android:name="android.permission.INTERNET" />'
              txt = txt.replace(target, target + "\n" + "\n".join(missing), 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(txt)
          EOF
          fi

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">#060607</item>
                  <item name="colorPrimaryDark">#060607</item>
                  <item name="colorAccent">#e4e4e7</item>
                  <item name="android:windowBackground">#060607</item>
                  <item name="android:statusBarColor">#060607</item>
                  <item name="android:navigationBarColor">#060607</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
                  <item name="android:enforceNavigationBarContrast">false</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">#060607</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">#060607</item>
              </style>
          </resources>
          EOF

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -f "$MAIN_ACT" ]; then
            PKG_LINE=$(head -n 1 "$MAIN_ACT")
            cat << EOF > "$MAIN_ACT"
          $PKG_LINE

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private void forceDarkSystemBars() {
                  Window window = getWindow();
                  int darkColor = Color.parseColor("#060607");
                  window.setStatusBarColor(darkColor);
                  window.setNavigationBarColor(darkColor);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      window.setNavigationBarContrastEnforced(false);
                  }
                  WindowInsetsControllerCompat controller =
                      WindowCompat.getInsetsController(window, window.getDecorView());
                  if (controller != null) {
                      controller.setAppearanceLightStatusBars(false);
                      controller.setAppearanceLightNavigationBars(false);
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  forceDarkSystemBars();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  forceDarkSystemBars();
              }
          }
          EOF
            echo "Patched $MAIN_ACT successfully"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" ../Pulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-APK
          path: Pulse.apk

      - name: Publish APK to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pulse Android (Последняя версия)
          body: Прямая ссылка на скачивание актуального APK-файла приложения Pulse.
          files: Pulse.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
